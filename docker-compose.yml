services:
    # Web Server
    tifah-web:
        container_name: tifah-nginx
        image: nginx:alpine
        deploy:
            resources:
                limits:
                    memory: 128M
                reservations:
                    memory: 64M
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - tifah_public_assets:/var/www/html/public
        depends_on:
            - tifah-app
        networks:
            - tifah-network
            - proxy-network
        restart: always

    # Laravel Application
    tifah-app:
        container_name: tifah-app
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                user: laravel_user
                uid: ${UID:-1000}
        deploy:
            resources:
                limits:
                    memory: 1G
                reservations:
                    memory: 512M
        volumes:
            - tifah_public_assets:/var/www/html/public
            - ./.env:/var/www/html/.env
        networks:
            - tifah-network
            - proxy-network
        restart: always

    # Database
    tifah-db:
        container_name: tifah-mysql
        image: mysql:8.0
        deploy:
            resources:
                limits:
                    memory: 1G
                reservations:
                    memory: 512M
        restart: always
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - tifah_db_data:/var/lib/mysql
        networks:
            tifah-network:
                aliases:
                    - db

networks:
    tifah-network:
        driver: bridge
    proxy-network:
        external: true

volumes:
    tifah_db_data:
    tifah_public_assets:
