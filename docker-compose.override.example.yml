services:
  # Web Server
  tifah-web:
    deploy: !reset
    restart: "no"
    ports:
      - "${FORWARD_NGINX_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./public:/var/www/html/public
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf

  # Application
  tifah-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    deploy: !reset
    restart: "no"
    volumes:
      - .:/var/www/html
      - ./public:/var/www/html/public
      - ./docker/php/msmtprc:/etc/msmtprc:ro
    ports:
      - "${VITE_PORT:-5173}:5173"

  # Database
  tifah-db:
    deploy: !reset
    restart: "no"
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"

  # Mailpit
  mailpit:
    container_name: tifah-mailpit
    image: axllent/mailpit
    restart: "no"
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web Dashboard port
    volumes:
      - tifah_mailpit_data:/data
    networks:
      - tifah-network

networks:
  proxy-network:
    external: false

volumes:
  tifah_mailpit_data:
